name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradlew: ./gradlew
          - os: windows-latest
            gradlew: ./gradlew.bat
          - os: macos-latest
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build desktop uber jar
        run: ${{ matrix.gradlew }} :composeApp:packageUberJarForCurrentOS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: composeApp/build/compose/jars/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach jars to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
